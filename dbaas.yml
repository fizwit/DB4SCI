version: "3.8"

services:
    dbaas:
        image: ${github_org}/dbaas:2.0.1
        hostname: dbaas
        ports:
            - "5008:5000"
        volumes:
            - dbaas:/data
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            TZ: "America/Los_Angeles"
            PYTHONUNBUFFERED: "1"
            FLASK_DEBUG: ${FLASK_DEBUG}
        labels:
            DESCRIPTION: "MyDB DBaaS Application"
            Contact: "$supportAdmin"
            # Non-secret values stay as env vars
        secrets:
            - mydb_aws_access_key_id
            - mydb_aws_secret_access_key
            - mydb_aws_bucket_name
            - mydb_flask_secret
            - mydb_sqlalchemy_admin_uri
            - mydb_sqlalchemy_migrate_uri
        deploy:
            restart_policy:
                condition: any

secrets:
    mydb_aws_access_key_id:
        external: true
    mydb_aws_secret_access_key:
        external: true
    mydb_aws_bucket_name:
        external: true 
    mydb_flask_secret:
        external: true
    mydb_sqlalchemy_admin_uri:
        external: true
    mydb_sqlalchemy_migrate_uri:
        external: true

volumes:
    dbaas:
        driver: local
